# Healthcare OS — local development & infrastructure
#
# Local app DB (default): SQLite via DATABASE_URL=file:./dev.db
# This Compose file provides Postgres + Redis for when you switch
# DATABASE_PROVIDER=postgresql (and for Redis from Step 2+).

name: healthcare-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: healthcare-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional API container — uses Postgres when PROFILE=docker
  # Local `npm run dev` typically runs on the host with SQLite instead.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: healthcare-os-api
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      APP_URL: http://localhost:5000
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthcare_os?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
