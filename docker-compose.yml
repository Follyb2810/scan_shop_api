# Healthcare OS — local infrastructure only
#
# Run the API on your machine (so errors show in the terminal):
#   npm run docker:up          # Postgres :5432 + Redis :6379
#   npm run dev                # API on host → connects via localhost
#
# Do NOT use profile "full" for day-to-day debugging — that runs the API
# inside Docker where logs are harder to follow.

name: healthcare-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_os
    ports:
      # Host → container (app on host uses localhost:5432)
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: healthcare-os-redis
    restart: unless-stopped
    ports:
      # Host → container (app on host uses localhost:6379)
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional — only if you explicitly want the API in Docker:
  #   docker compose --profile full up -d --build
  # Prefer `npm run dev` on the host for debugging.
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: healthcare-os-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      APP_URL: http://localhost:5000
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthcare_os?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      AUTO_SEED_DEMO: "true"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
