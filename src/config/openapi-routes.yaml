# Supplemental OpenAPI paths so Swagger UI lists the full mobile/staff surface.
# Route handlers live in src/modules/**/presentation; keep this in sync when adding APIs.

paths:
  /api/v1/marketplace/categories:
    get:
      tags: [Marketplace]
      summary: List marketplace categories
      responses:
        "200": { description: OK }

  /api/v1/marketplace/listings/{listingId}:
    get:
      tags: [Marketplace]
      summary: Get listing detail
      parameters:
        - in: path
          name: listingId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/marketplace/search:
    get:
      tags: [Marketplace]
      summary: Search listings
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/marketplace/listings/{listingId}/publish:
    post:
      tags: [Marketplace]
      summary: Publish listing (starts approval workflow)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - in: path
          name: listingId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/marketplace/seller/listings:
    get:
      tags: [Marketplace]
      summary: List seller org listings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200": { description: OK }

  /api/v1/marketplace/cart:
    get:
      tags: [Marketplace]
      summary: Get my cart
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [Marketplace]
      summary: Upsert cart item
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, quantity]
              properties:
                listingId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200": { description: OK }

  /api/v1/marketplace/cart/{listingId}:
    delete:
      tags: [Marketplace]
      summary: Remove cart item
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listingId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/marketplace/orders/{orderId}:
    get:
      tags: [Marketplace]
      summary: Get my order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/marketplace/wishlist:
    get:
      tags: [Marketplace]
      summary: List wishlist
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/marketplace/wishlist/{listingId}:
    post:
      tags: [Marketplace]
      summary: Add to wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listingId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
    delete:
      tags: [Marketplace]
      summary: Remove from wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listingId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/marketplace/reviews:
    post:
      tags: [Marketplace]
      summary: Create review
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }

  /api/v1/marketplace/coupons/validate:
    get:
      tags: [Marketplace]
      summary: Validate coupon code
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: orderTotal
          schema: { type: number }
      responses:
        "200": { description: OK }

  /api/v1/orders:
    get:
      tags: [Marketplace]
      summary: Org orders inbox (staff)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200": { description: OK }

  /api/v1/orders/{orderId}/fulfill:
    patch:
      tags: [Marketplace]
      summary: Fulfill org order
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/customers/profile:
    post:
      tags: [Customer]
      summary: Ensure customer profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/customers/me/addresses:
    get:
      tags: [Customer]
      summary: List addresses
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [Customer]
      summary: Create address
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }

  /api/v1/customers/me/addresses/{addressId}:
    patch:
      tags: [Customer]
      summary: Update address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: addressId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
    delete:
      tags: [Customer]
      summary: Delete address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: addressId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/payments/stub/pay:
    post:
      tags: [Payments]
      summary: Sandbox complete payment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/payments/{id}:
    get:
      tags: [Payments]
      summary: Get payment by id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark notification read
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications read
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/organizations/{orgId}:
    get:
      tags: [Organizations]
