name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma db push
        env:
          DATABASE_URL: file:./ci.db
          DATABASE_PROVIDER: sqlite
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: file:./ci.db
          DATABASE_PROVIDER: sqlite
          REDIS_ENABLED: "false"
          LOG_LEVEL: silent
          JWT_ACCESS_SECRET: ci-access-secret-change-me-32charsxx
          JWT_REFRESH_SECRET: ci-refresh-secret-change-me-32chars
          HMAC_SECRET: ci-hmac-secret-change-me-32charsxxxx
